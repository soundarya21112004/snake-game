<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Modern Snake Game</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #2f5d1f;
      font-family: Arial, sans-serif;
    }

    .game-container {
      width: 640px;
      background: #3e6b28;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #3e6b28;
      color: white;
      font-size: 28px;
    }

    .score-board {
      display: flex;
      gap: 25px;
      align-items: center;
      font-size: 22px;
    }

    .score-board span {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    canvas {
      display: block;
      margin: auto;
      background: #aad751;
    }

    .controls {
      text-align: center;
      padding: 15px;
      background: #3e6b28;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: white;
      color: #2f5d1f;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #f1f1f1;
      transform: scale(1.05);
    }

  </style>
</head>

<body>

<div class="game-container">

  <div class="top-bar">

    <div class="score-board">
      <span>🍎 <span id="score">0</span></span>
      <span>🏆 <span id="highScore">0</span></span>
    </div>

    <div>
      🐍
    </div>

  </div>

  <canvas id="game" width="600" height="520"></canvas>

  <div class="controls">
    <button onclick="startGame()">Start Game</button>
  </div>

</div>

<script>

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const box = 20;

const rows = canvas.height / box;
const cols = canvas.width / box;

let snake;
let food;
let direction;
let game;
let score;
let highScore = 0;

function startGame() {

  snake = [
    { x: 5 * box, y: 5 * box },
    { x: 4 * box, y: 5 * box },
    { x: 3 * box, y: 5 * box }
  ];

  direction = 'RIGHT';

  score = 0;

  document.getElementById('score').innerText = score;

  food = generateFood();

  clearInterval(game);

  game = setInterval(draw, 120);
}

function generateFood() {

  return {
    x: Math.floor(Math.random() * cols) * box,
    y: Math.floor(Math.random() * rows) * box
  };
}

window.addEventListener('keydown', changeDirection);

function changeDirection(event) {

  if (event.key === 'ArrowUp' && direction !== 'DOWN') {
    direction = 'UP';
  }

  if (event.key === 'ArrowDown' && direction !== 'UP') {
    direction = 'DOWN';
  }

  if (event.key === 'ArrowLeft' && direction !== 'RIGHT') {
    direction = 'LEFT';
  }

  if (event.key === 'ArrowRight' && direction !== 'LEFT') {
    direction = 'RIGHT';
  }
}

function drawBoard() {

  for (let row = 0; row < rows; row++) {

    for (let col = 0; col < cols; col++) {

      if ((row + col) % 2 === 0) {
        ctx.fillStyle = '#aad751';
      } else {
        ctx.fillStyle = '#a2d149';
      }

      ctx.fillRect(col * box, row * box, box, box);
    }
  }
}

function drawFood() {

  ctx.fillStyle = '#ff3d00';

  ctx.beginPath();
  ctx.arc(food.x + 10, food.y + 10, 10, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'green';
  ctx.fillRect(food.x + 8, food.y - 2, 4, 8);
}

function drawSnake() {

  snake.forEach((part, index) => {

    // Green gradient body
    let gradient = ctx.createLinearGradient(
      part.x,
      part.y,
      part.x + box,
      part.y + box
    );

    gradient.addColorStop(0, '#a8f542');
    gradient.addColorStop(1, '#4e9a06');

    ctx.fillStyle = gradient;

    // Snake body
    ctx.beginPath();
    ctx.roundRect(part.x, part.y, box, box, 10);
    ctx.fill();

    // Black spots
    ctx.fillStyle = '#1d1d1d';

    ctx.beginPath();
    ctx.arc(part.x + 6, part.y + 6, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(part.x + 14, part.y + 14, 2, 0, Math.PI * 2);
    ctx.fill();

    // Snake head
    if (index === 0) {

      // Head highlight
      ctx.fillStyle = '#b6ff4d';

      ctx.beginPath();
      ctx.roundRect(part.x, part.y, box, box, 12);
      ctx.fill();

      // Eyes
      ctx.fillStyle = 'white';

      ctx.beginPath();
      ctx.arc(part.x + 6, part.y + 7, 4, 0, Math.PI * 2);
      ctx.arc(part.x + 14, part.y + 7, 4, 0, Math.PI * 2);
      ctx.fill();

      // Eye balls
      ctx.fillStyle = 'black';

      ctx.beginPath();
      ctx.arc(part.x + 6, part.y + 7, 1.5, 0, Math.PI * 2);
      ctx.arc(part.x + 14, part.y + 7, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Smile
      ctx.strokeStyle = '#1d1d1d';
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      ctx.arc(part.x + 10, part.y + 12, 4, 0, Math.PI);
      ctx.stroke();

      // Tongue
      ctx.strokeStyle = 'red';
      ctx.lineWidth = 1;

      ctx.beginPath();
      ctx.moveTo(part.x + 10, part.y + 18);
      ctx.lineTo(part.x + 10, part.y + 22);
      ctx.stroke();
    }
  });
}

function moveSnake() {

  let headX = snake[0].x;
  let headY = snake[0].y;

  if (direction === 'UP') headY -= box;
  if (direction === 'DOWN') headY += box;
  if (direction === 'LEFT') headX -= box;
  if (direction === 'RIGHT') headX += box;

  const newHead = {
    x: headX,
    y: headY
  };

  // Wall collision
  if (
    headX < 0 ||
    headY < 0 ||
    headX >= canvas.width ||
    headY >= canvas.height ||
    collision(newHead, snake)
  ) {

    clearInterval(game);

    alert('Game Over');

    return;
  }

  snake.unshift(newHead);

  // Eat food
  if (headX === food.x && headY === food.y) {

    score++;

    if (score > highScore) {
      highScore = score;
    }

    document.getElementById('score').innerText = score;
    document.getElementById('highScore').innerText = highScore;

    food = generateFood();

  } else {

    snake.pop();
  }
}

function collision(head, array) {

  for (let i = 0; i < array.length; i++) {

    if (head.x === array[i].x && head.y === array[i].y) {
      return true;
    }
  }

  return false;
}

function draw() {

  drawBoard();

  drawFood();

  moveSnake();

  drawSnake();
}

</script>

</body>
</html>
